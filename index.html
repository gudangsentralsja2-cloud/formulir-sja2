function isMoneyField(k){return ['harga','biayaBI','biayaBL','biayaSBI','total','pemakaian','kasAwal','kasAkhir','budgetAwal','budgetPakai','budgetAkhir','jumlah','jamBayar','final'].includes(k)}
function spellRupiah(n){n=Math.floor(Math.abs(Number(n)||0));if(!n)return '';const a=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];function words(x){if(x<12)return a[x];if(x<20)return words(x-10)+' belas';if(x<100)return words(Math.floor(x/10))+' puluh'+(x%10?' '+words(x%10):'');if(x<200)return 'seratus'+(x>100?' '+words(x-100):'');if(x<1000)return words(Math.floor(x/100))+' ratus'+(x%100?' '+words(x%100):'');if(x<2000)return 'seribu'+(x>1000?' '+words(x-1000):'');if(x<1e6)return words(Math.floor(x/1000))+' ribu'+(x%1000?' '+words(x%1000):'');if(x<1e9)return words(Math.floor(x/1e6))+' juta'+(x%1e6?' '+words(x%1e6):'');if(x<1e12)return words(Math.floor(x/1e9))+' miliar'+(x%1e9?' '+words(x%1e9):'');return String(x)}return n?words(n).replace(/^./,c=>c.toUpperCase())+' Rupiah':''}
function fields(){let d=samples[type];document.querySelector('#fields').innerHTML=Object.keys(d).map(k=>`<div class="field ${['karyawan','npk','keperluan','keterangan','alasan'].includes(k)?'wide':''}"><label>${labels[type][k]||k}</label>${['waktuMulai','waktuSelesai'].includes(k)?`<select data-k="${k}">${Array.from({length:48},(_,i)=>{const t=String(Math.floor(i/2)).padStart(2,"0")+":"+(i%2?"30":"00");return `<option value="${t}" ${d[k]===t?"selected":""}>${t}</option>`}).join("")}</select>`:['karyawan','npk','keperluan','keterangan','alasan','penyetujuJabatan','pembuatJabatan','namaAdmin'].includes(k)?`<textarea data-k="${k}" >${esc(d[k])}</textarea>`:`<input data-k="${k}" ${['tanggal','tanggalSPL','tglRealisasi','tglDok'].includes(k)?'type="date"':'type="text"'} value="${esc(d[k])}">`}</div>`).join('');document.querySelectorAll('[data-k]').forEach(e=>{if(['tanggal','tanggalSPL','tglRealisasi','tglDok'].includes(e.dataset.k)){e.type='date';if(e.value&&!/^\d{4}-\d{2}-\d{2}$/.test(e.value))e.value='';}if(isMoneyField(e.dataset.k)){e.inputMode='numeric';e.addEventListener('input',()=>{const pos=e.selectionStart;const digits=e.value.replace(/\D/g,'');e.value=digits?Number(digits).toLocaleString('id-ID'):'';try{e.setSelectionRange(e.value.length,e.value.length)}catch{}});}e.addEventListener('input',()=>{if(type==='bayar'&&e.dataset.k==='jumlah'){const t=document.querySelector('[data-k="terbilang"]');if(t)t.value=spellRupiah(moneyNumber(e.value));}preview();scheduleSave();});});document.querySelector('#title').textContent=({lembur:'Surat Perintah dan Laporan Realisasi Kerja Lembur',ba:'Berita Acara Hasil Kerja',bayar:'Permohonan Pembayaran',retur:'Form Pengembalian / Retur'})[type];document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.dataset.type===type));preview()}
function lembur(v){let n=v.karyawan.split('\n').map(x=>x.trim()).filter(Boolean),p=v.npk.split('\n').map(x=>x.trim());let count=Math.max(n.length,p.length,1);let rows='';for(let i=0;i<count;i++)rows+=`<tr>${cell(i+1,'center')}${cell(p[i]||'')}${cell(n[i]||'')}${cell(v.jenis||'')}${cell((v.waktuMulai||'')+' - '+(v.waktuSelesai||''))}${cell(v.keperluan||'')}${cell('')}</tr>`;const meta=(a,b)=>`<tr><td>${a}</td><td>:</td><td>${esc(b)}</td></tr>`;return `<section class="paper portrait"><h2 class="center" style="font-size:16pt;margin:0 0 8px">SURAT PERINTAH KERJA LEMBUR</h2><table class="nb meta" style="margin-bottom:12px;width:auto;min-width:65%"><colgroup><col style="width:100px"><col style="width:12px"><col></colgroup>${meta('DIVISI',v.divisi)}${meta('DEPARTEMEN',v.departemen)}${meta('TANGGAL',dateFmt(v.tanggal))}</table><table class="tidy data-table"><thead><tr><th>NO</th><th>NPK</th><th>NAMA KARYAWAN</th><th>JENIS PEKERJAAN</th><th>RENCANA WAKTU LEMBUR</th><th>KEPERLUAN</th><th>TANDA TANGAN</th></tr></thead><tbody>${rows}</tbody></table><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-top:18px;gap:12px"><div style="flex:1;min-width:42%;padding-top:10px"><b>Keterangan:</b><br>Form ini harap diserahkan ke HR Operation/HRGA<br>selambat-lambatnya 1 (satu) hari sebelum kerja lembur<br>Tembusan untuk Dept. GA atau Security</div><div style="width:48%;margin-left:auto;text-align:right"><b>${esc(v.lokasiSPL)}${v.tanggalSPL?' , '+esc(dateFmt(v.tanggalSPL)):''}</b><table class="tidy" style="margin-top:12px;text-align:center;table-layout:fixed;width:100%"><colgroup><col style="width:50%"><col style="width:50%"></colgroup><thead><tr><th>Menyetujui,</th><th>Dibuat,</th></tr></thead><tbody><tr><td class="sig">${esc(sigParts(v.penyetujuJabatan).name)}</td><td class="sig">${esc(sigParts(v.pembuatJabatan).name)}</td></tr><tr><th><b>${esc(sigParts(v.penyetujuJabatan).job)}</b></th><th><b>${esc(sigParts(v.pembuatJabatan).job)}</b></th></tr></tbody></table></div></div><h2 class="doc-title" style="margin-top:24px">LAPORAN REALISASI KERJA LEMBUR</h2><div class="sub">PERIODE : ${esc(v.periode)}</div><div style="margin:6px 0"><b>DIVISI/PT :</b> ${esc(v.divisiPt)}</div><table class="tidy data-table" style="margin-top:10px"><thead><tr><th>NO</th><th>NPK</th><th>NAMA KARYAWAN</th><th>DEPT</th><th>TGL</th><th>JENIS PEKERJAAN</th><th>JUMLAH JAM DIBAYAR</th><th>JUMLAH (Rp)</th><th>HASIL KERJA</th></tr></thead><tbody>${n.map((name,i)=>`<tr>${cell(i+1,'center')}${cell(p[i]||'')}${cell(name)}${cell(v.dept)}${cell(dateFmt(v.tglRealisasi))}${cell(v.jenis)}${cell(timeDuration(v))}${cell(v.jamBayar)}${cell(v.hasil)}</tr>`).join('')}</tbody></table><p style="text-align:right;margin:14px 0 8px"><b>${esc(v.lokasiSPL)}${v.tanggalSPL?' , '+esc(dateFmt(v.tanggalSPL)):''}</b></p><table class="tidy signatures signatures-three" style="table-layout:fixed;width:100%"><colgroup><col style="width:33.333%"><col style="width:33.333%"><col style="width:33.334%"></colgroup><thead><tr><th>Disetujui,</th><th>Diketahui,</th><th>Dibuat,</th></tr></thead><tbody><tr><td class="sig">${esc(sigParts(v.namaAdmin).name)}</td><td class="sig">${esc(sigParts(v.penyetujuJabatan).name)}</td><td class="sig">${esc(sigParts(v.pembuatJabatan).name)}</td></tr><tr><th><b>${esc(sigParts(v.namaAdmin).job)}</b></th><th><b>${esc(sigParts(v.penyetujuJabatan).job)}</b></th><th><b>${esc(sigParts(v.pembuatJabatan).job)}</b></th></tr></tbody></table></section>`}
function moneyNumber(s){let raw=String(s||'').trim();if(!raw)return 0;raw=raw.replace(/[^0-9,.-]/g,'');if(raw.includes(',')&&!raw.includes('.'))raw=raw.replace(',','.');else raw=raw.replace(/\./g,'').replace(',','.');const n=Number(raw);return Number.isFinite(n)?n:0}function fmtMoney(n){return Math.round(n).toLocaleString('id-ID')}
function ba(v){let base=moneyNumber(v.total||v.biayaBI||v.harga), rate=moneyNumber(v.ppn), tax=base*rate/100, final=base+tax;const money=(x)=>String(x||'').trim()?fmtMoney(moneyNumber(x)):'';return `<section class="paper landscape"><div>PT. SAWIT JAYA ABADI 2</div><h2 class="center" style="text-decoration:underline;margin:5px 0 18px">BERITA ACARA HASIL KERJA</h2><table class="nb meta" style="width:72%;margin-bottom:14px">${[['No',v.nomor],['Periode',v.periode],['NO PO',v.po],['Jenis Pekerjaan',v.jenis]].map(a=>`<tr><td><b>${a[0]}</b></td><td>:</td><td>${esc(a[1])}</td></tr>`).join('')}</table><table class="ba-grid"><colgroup><col style="width:4%"><col style="width:16%"><col style="width:12%"><col style="width:5%"><col style="width:7%"><col style="width:10%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:8%"><col style="width:6%"><col style="width:8%"><col style="width:9%"></colgroup><thead><tr><th rowspan="2">No.</th><th rowspan="2">Part Description</th><th rowspan="2">Spec 1</th><th rowspan="2">Quantity</th><th rowspan="2">Purch U/M</th><th rowspan="2">Price/Curr</th><th colspan="3">Hasil Kerja/M3</th><th colspan="3">Jumlah Biaya</th><th rowspan="2">KETERANGAN</th></tr><tr><th>BI</th><th>BL</th><th>SBI</th><th>BI</th><th>BL</th><th>SBI</th></tr></thead><tbody><tr><td>1</td>${cell(v.part,'left')}${cell(v.spec)}${cell(v.qty)}${cell(v.unit)}${cell(money(v.harga),'money')}${cell(v.hasilBI)}${cell(v.hasilBL)}${cell(v.hasilSBI)}${cell(money(v.biayaBI),'money')}${cell(money(v.biayaBL),'money')}${cell(money(v.biayaSBI),'money')}${cell(v.keterangan,'left')}</tr><tr><td colspan="6" class="bold center">TOTAL</td><td colspan="3"></td><td class="money bold">${money(v.total||v.biayaBI||v.harga)}</td><td></td><td></td><td></td></tr></tbody></table><p style="text-align:right;margin:16px 0">${esc(v.kota)}　${esc(dateFmt(v.tanggal))}</p><table class="nb ba-total"><tr><td>Total</td><td>${String(v.total||'').trim()?'Rp':''}</td><td class="money">${money(v.total)}</td></tr><tr><td>PPN ${esc(v.ppn||'')}%</td><td>${String(v.total||v.biayaBI||v.harga||'').trim()?'Rp':''}</td><td class="money">${String(v.ppn||'').trim()&&base?fmtMoney(tax):''}</td></tr><tr><td><b>Final Total</b></td><td>${base?'Rp':''}</td><td class="money"><b>${base?fmtMoney(final):''}</b></td></tr></table><table class="nb signatures"><tr><th>Diketahui Oleh,</th><th>Menyetujui,</th><th>Diperiksa Oleh,</th><th>Dibuat Oleh,</th></tr><tr>${[v.diketahui,v.disetujui,v.diperiksa,v.dibuat].map(x=>`<td class="sig"><b><u>${esc(x)}</u></b></td>`).join('')}</tr><tr>${['Administratur','Kor. Administrasi','Asisten Gudang'].map(x=>`<td class="center">${x}</td>`).join('')}</tr></table><div class="center" style="font-size:8pt;margin-top:5px">Supplier: ${esc(v.supplier)}</div></section>`}
function bayar(v){return `<section class="paper half"><div style="border:1px solid #222;height:100%;padding:4mm 5mm"><i>${esc(v.perusahaan)}</i><h2 class="center" style="margin:0 0 18px">${esc('PERMOHONAN PEMBAYARAN')}</h2><hr><table class="nb payfields data-table" style="margin-top:16px"><tr><td>Kepada</td><td>:</td><td><b>${esc(v.kepada)}</b></td><td>Nomor</td><td>:</td><td>${esc(v.nomor)}</td></tr><tr><td>Jumlah</td><td>:</td><td>${String(v.jumlah||'').trim()?'Rp　'+esc(v.jumlah):''}</td><td>Tanggal</td><td>:</td><td>${esc(dateFmt(v.tanggal))}</td></tr><tr><td>Terbilang</td><td>:</td><td colspan="4"><i>${esc(v.terbilang||spellRupiah(moneyNumber(v.jumlah)))}</i></td></tr></table><div style="margin-top:28px">Keterangan　　　 :　${esc(v.keterangan)}<div class="dotted" style="margin-left:35mm"></div><div class="dotted" style="margin-left:35mm"></div></div><table class="nb" style="margin-top:16px"><tr><td>PK / BA. No</td><td>:</td><td><div class="dotted">${esc(v.pk)}</div></td><td>BPK No.</td><td>:</td><td><div class="dotted">${esc(v.bpk)}</div></td></tr><tr><td>PO / TTG No</td><td>:</td><td><div class="dotted">${esc(v.po)}</div></td><td>Bank</td><td>:</td><td><div class="dotted">${esc(v.bank)}</div></td></tr><tr><td>Tanggal</td><td>:</td><td><div class="dotted">${esc(dateFmt(v.tglDok))}</div></td><td>Cek / Giro</td><td>:</td><td><div class="dotted">${esc(v.cek)}</div></td></tr><tr><td>Account</td><td>:</td><td colspan="4"><div class="dotted">${esc(v.account)}</div></td></tr></table><div style="display:flex;gap:10px;margin-top:25px"><div style="width:42%;line-height:1.7">Saldo Kas Awal　: ${esc(v.kasAwal)}<br>Pemakaian　: ${String(v.pemakaian||'').trim()?'Rp '+esc(v.pemakaian):''}<br>Saldo Kas Akhir　: ${esc(v.kasAkhir)}<br>Saldo Budget Awal　: ${esc(v.budgetAwal)}<br>Pemakaian　: ${esc(v.budgetPakai)}<br>Saldo Budget Akhir　: ${esc(v.budgetAkhir)}</div><table style="width:58%;align-self:flex-end"><tr><th>Disetujui oleh,</th><th>Dibuat oleh,</th></tr><tr><td class="sig"><b>${esc(v.disetujui)}</b></td><td class="sig"><b>${esc(v.dibuat)}</b></td></tr><tr><td class="center">${esc(v.jabatanSetuju)}</td><td class="center">${esc(v.jabatanPembuat)}</td></tr></table></div></div></section>`}
function retur(v){return `<section class="paper portrait"><div style="border:2px solid #111;min-height:270mm;padding:5mm 7mm"><div class="right" style="color:#5689bb;font-style:italic">Form 12-proc</div><h2 class="center" style="font-size:12pt;margin:10px 0 2px">FORM PENGEMBALIAN BARANG / RETUR KE GUDANG</h2><div class="center" style="margin-bottom:20px">${esc(v.nomorForm)}</div><table class="nb returfields data-table"><tr><td>PT</td><td>:</td><td><div class="dotted">${esc(v.pt)}</div></td><td>NO. MR</td><td>:</td><td><div class="dotted">${esc(v.mr)}</div></td></tr><tr><td>TANGGAL</td><td>:</td><td><div class="dotted">${esc(dateFmt(v.tanggal))}</div></td><td>COST CENTER</td><td>:</td><td><div class="dotted">${esc(v.cost)}</div></td></tr><tr><td>DEPARTEMEN</td><td>:</td><td><div class="dotted">${esc(v.departemen)}</div></td></tr><tr><td>PART NUMBER</td><td>:</td><td><div class="dotted">${esc(v.part)}</div></td></tr><tr><td>NAMA BARANG</td><td>:</td><td><div class="dotted">${esc(v.barang)}</div></td></tr><tr><td>QTY BARANG</td><td>:</td><td><div class="dotted">${esc(v.qty)}</div></td></tr><tr><td>ALASAN RETUR</td><td>:</td><td><div class="dotted">${esc(v.alasan)}</div><div class="dotted"></div><div class="dotted"></div></td></tr></table><div style="display:flex;justify-content:space-between;text-align:center;margin-top:25mm"><div style="width:30%">Dibuat Oleh / Pemohon<br><br><br><br><u>${esc(v.pemohon)}</u><br><i>${esc(v.jabatanPemohon)}</i></div><div style="width:30%">Disetujui Oleh,<br><br><br><br><u>${esc(v.setuju)}</u><br><i>${esc(v.jabatanSetuju)}</i></div><div style="width:30%">Diterima Oleh,<br><br><br><br><u>${esc(v.terima)}</u><br><i>${esc(v.jabatanTerima)}</i></div></div><div style="font-size:8pt;font-style:italic;margin-top:20mm">* 1 Form barang yang dikembalikan ke Gudang<br>*Lembar ke-1 untuk Gudang, lembar ke-2 untuk User (Pemohon)</div></div></section>`}
function preview(){let v=val();document.querySelector('#preview').innerHTML=type==='lembur'?lembur(v):type==='ba'?ba(v):type==='bayar'?bayar(v):retur(v)}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{type=b.dataset.type;fields();window.scrollTo({top:0,behavior:'smooth'})});document.querySelector('#print').onclick=()=>{preview();window.print()};
document.querySelector('#loginBtn').onclick=async()=>{const email=document.querySelector('#authEmail').value.trim(),password=document.querySelector('#authPassword').value;if(!email||!password){authMsg('Masukkan email dan password.');return}try{authMsg('');const j=await sbAuth('token?grant_type=password',{email,password});if(!j.access_token)throw new Error('Login belum menghasilkan sesi. Periksa verifikasi email.');setLoggedIn(j);await loadShared();authMsg('');}catch(e){authMsg(e.message)}};
document.querySelector('#signupBtn').onclick=()=>{document.querySelector('#signupName').value='';document.querySelector('#signupEmail').value=document.querySelector('#authEmail').value.trim();document.querySelector('#signupPassword').value='';document.querySelector('#signupMessage').textContent='';document.querySelector('#signupModal').style.display='flex';};
document.querySelector('#cancelSignupBtn').onclick=()=>{document.querySelector('#signupModal').style.display='none';};
document.querySelector('#saveSignupBtn').onclick=async()=>{const name=document.querySelector('#signupName').value.trim(),email=document.querySelector('#signupEmail').value.trim(),password=document.querySelector('#signupPassword').value;const msg=document.querySelector('#signupMessage');if(!name||!email||!password){msg.textContent='Lengkapi nama pengguna, email, dan password.';return}if(password.length<6){msg.textContent='Password minimal 6 karakter.';return}const btn=document.querySelector('#saveSignupBtn');btn.disabled=true;btn.textContent='Mengirim...';try{const j=await sbAuth('signup?redirect_to='+encodeURIComponent('https://formulir-sja2.web.app/'),{email,password,data:{name,full_name:name,username:name}});if(j.access_token){document.querySelector('#signupModal').style.display='none';document.querySelector('#authEmail').value=email;document.querySelector('#authPassword').value='';authMsg('Akun dibuat. Sesi langsung aktif; jika konfirmasi email dinonaktifkan di Supabase, email verifikasi memang tidak dikirim.');setLoggedIn(j);await loadShared();}else{msg.textContent='Pendaftaran diterima untuk '+email+'. Periksa Kotak Masuk, Spam, dan Promosi. Jika email tetap tidak ada, administrator perlu memeriksa Authentication > Email/SMTP di Supabase.';document.querySelector('#authEmail').value=email;}}catch(e){msg.textContent='Pendaftaran gagal: '+e.message;}finally{btn.disabled=false;btn.textContent='Simpan & Kirim Verifikasi';}};
document.querySelector('#forgotPassBtn').onclick=async()=>{const email=document.querySelector('#authEmail').value.trim();if(!email){authMsg('Masukkan email akun terlebih dahulu, lalu tekan Lupa kata sandi.');return}try{const r=await fetch(`${SUPABASE_URL}/auth/v1/recover`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||j.msg||'Permintaan reset gagal.')}authMsg('Jika email terdaftar, instruksi pemulihan kata sandi akan dikirim melalui email.')}catch(e){authMsg(e.message)}};
document.querySelector('#forgotEmailBtn').onclick=()=>authMsg('Pemulihan email tidak dapat dilakukan otomatis dari halaman publik demi keamanan akun. Periksa email yang pernah digunakan atau hubungi administrator untuk bantuan.');
document.querySelector('#logoutBtn').onclick=()=>{authSession=null;setLoggedIn(null);document.querySelector('#authPassword').value='';authMsg('Anda telah keluar.')};
setLoggedIn(null);fields();
</script></body></html>
